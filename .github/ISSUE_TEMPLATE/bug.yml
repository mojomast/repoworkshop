name: Bug report
description: Report incorrect, unsafe, or unclear package behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or sensitive repository data here. Use GitHub Security Advisories as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - OpenCode
        - Claude Code
        - Hermes Agent
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use sanitized placeholders; do not paste secrets, private source, board state, or tokens.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Reproduction and validation
      description: Include minimal sanitized steps and command versions.
    validations:
      required: true
